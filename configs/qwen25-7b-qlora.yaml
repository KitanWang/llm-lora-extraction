# 主力配置 B：Qwen2.5-7B-Instruct + QLoRA（NF4 4bit 量化主干）
#
# 这是「单张 8GB 消费级显卡微调 7B」的那条路：
#   - 主干 4bit NF4 量化，约 4.5GB 权重
#   - LoRA adapter 以 bf16 训练，可训练参数占比 <1%
#   - 配合 gradient checkpointing + paged_adamw_8bit 把优化器状态压到可接受范围
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
train_file: data/processed/train.jsonl
val_file: data/processed/val.jsonl
output_dir: outputs/qwen25-7b-qlora

max_seq_length: 1024
per_device_train_batch_size: 1           # 7B 在 8GB 卡上必须压到 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16          # 等效 batch size = 16
learning_rate: 1.5e-4
num_train_epochs: 2.0
warmup_ratio: 0.05
lr_scheduler_type: cosine
max_grad_norm: 1.0
logging_steps: 5
save_strategy: epoch
eval_strategy: epoch

bf16: true
gradient_checkpointing: true
optim: paged_adamw_8bit                  # 优化器状态分页到 CPU，避免 OOM
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
# 7B 在 8GB 卡上必须为 false：不把 embed_tokens / lm_head 升到 fp32。
# 这两者各 152064×3584（tie_word_embeddings=false，互不共享），
# fp16 各 1.02 GB，升 fp32 后各 2.04 GB —— 合计多占 2.04 GB，必然 OOM。
# 实测：升级→训练峰值 10.52 GiB（超物理显存，靠内存超售卖命，110s/step）；
#       不升级→峰值 6.05 GiB，可正常训练。
fp32_upcast_non_quantized: false

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

seed: 42
report_to: none

# 只对答案位置计算 logits（lm_head 输出 [B, T, 151936]，T=1024 时仅此一项就 ~311MB）。
# 0.5B QLoRA 实测：开启前后训练峰值 3.40 GiB → 1.43 GiB（降 58%），
# 且监督 token 数与 loss 完全等价（相对差 9.4e-08，bf16 精度内）。
# 这是 7B 能在 8 GB 卡上训练的前提，不要关闭。
logits_to_keep: true
